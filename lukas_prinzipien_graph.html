{id:"p1_4",label:"Lk 10,2",title:"Die Ernte ist groß",type:"principle",cluster:"c1",text:"Die Ernte zwar ist groß, der Arbeiter aber sind wenige. Bittet nun den Herrn der Ernte, daß er Arbeiter aussende in seine Ernte."},
{id:"p1_5",label:"Lk 13,19",title:"Das Senfkorn",type:"principle",cluster:"c1",text:"Es ist gleich einem Senfkorn, welches ein Mensch nahm und in seinen Garten warf; und es wuchs und wurde zu einem großen Baume."},
{id:"p2_1",label:"Lk 6,37",title:"Richtet nicht, lasset los",type:"principle",cluster:"c2",text:"Und richtet nicht, und ihr werdet nicht gerichtet werden; verurteilet nicht, und ihr werdet nicht verurteilt werden. Lasset los, und ihr werdet losgelassen werden."},
{id:"p2_2",label:"Lk 7,47",title:"Wem viel vergeben wird",type:"principle",cluster:"c2",text:"Ihre vielen Sünden sind vergeben, denn sie hat viel geliebt; wem aber wenig vergeben wird, der liebt wenig."},
{id:"p2_3",label:"Lk 15,7",title:"Freude über einen Sünder",type:"principle",cluster:"c2",text:"Also wird Freude im Himmel sein über einen Sünder, der Buße tut, mehr als über neunundneunzig Gerechte, welche der Buße nicht bedürfen."},
{id:"p2_4",label:"Lk 15,10",title:"Freude vor den Engeln",type:"principle",cluster:"c2",text:"Also, sage ich euch, ist Freude vor den Engeln Gottes über einen Sünder, der Buße tut."},
{id:"p2_5",label:"Lk 17,3",title:"Vergib deinem Bruder",type:"principle",cluster:"c2",text:"Wenn dein Bruder sündigt, so verweise es ihm, und wenn er es bereut, so vergib ihm."},
{id:"p2_6",label:"Lk 17,4",title:"Siebenmal am Tag",type:"principle",cluster:"c2",text:"Und wenn er siebenmal des Tages an dir sündigt und siebenmal zu dir umkehrt und spricht: Ich bereue es, so sollst du ihm vergeben."},
{id:"p3_1",label:"Lk 1,52",title:"Mächtige herab, Niedrige hinauf",type:"principle",cluster:"c3",text:"Er hat Mächtige von Thronen hinabgestoßen, und Niedrige erhöht."},
{id:"p3_2",label:"Lk 1,53",title:"Hungrige erfüllt, Reiche leer",type:"principle",cluster:"c3",text:"Hungrige hat er mit Gütern erfüllt, und Reiche leer fortgeschickt."},
{id:"p3_3",label:"Lk 9,48",title:"Der Kleinste ist groß",type:"principle",cluster:"c3",text:"Denn wer der Kleinste ist unter euch allen, der ist groß."},
{id:"p3_4",label:"Lk 13,30",title:"Letzte werden Erste",type:"principle",cluster:"c3",text:"Und siehe, es sind Letzte, welche Erste sein werden, und es sind Erste, welche Letzte sein werden."},
{id:"p3_5",label:"Lk 14,11",title:"Wer sich erhöht, wird erniedrigt",type:"principle",cluster:"c3",text:"Denn jeder, der sich selbst erhöht, wird erniedrigt werden, und wer sich selbst erniedrigt, wird erhöht werden."},
{id:"p3_6",label:"Lk 18,14",title:"Der Zöllner ging gerechtfertigt",type:"principle",cluster:"c3",text:"Denn jeder, der sich selbst erhöht, wird erniedrigt werden; wer aber sich selbst erniedrigt, wird erhöht werden."},
{id:"p3_7",label:"Lk 16,15",title:"Was hoch ist bei Menschen",type:"principle",cluster:"c3",text:"Denn was unter den Menschen hoch ist, ist ein Greuel vor Gott."},
{id:"p3_8",label:"Lk 21,3",title:"Die arme Witwe gab mehr",type:"principle",cluster:"c3",text:"In Wahrheit sage ich euch, daß diese arme Witwe mehr eingelegt hat als alle."},
{id:"p3_9",label:"Lk 21,4",title:"Von ihrem Mangel alles",type:"principle",cluster:"c3",text:"Diese aber hat von ihrem Mangel den ganzen Lebensunterhalt, den sie hatte, eingelegt."},
{id:"p4_1",label:"Lk 1,37",title:"Bei Gott kein Ding unmöglich",type:"principle",cluster:"c4",text:"Denn bei Gott wird kein Ding unmöglich sein."},
{id:"p4_2",label:"Lk 1,45",title:"Glückselig, die geglaubt hat",type:"principle",cluster:"c4",text:"Und glückselig, die geglaubt hat, denn es wird zur Erfüllung kommen, was von dem Herrn zu ihr geredet ist!"},
{id:"p4_3",label:"Lk 5,5",title:"Auf dein Wort",type:"principle",cluster:"c4",text:"Meister, wir haben uns die ganze Nacht hindurch bemüht und nichts gefangen, aber auf dein Wort will ich das Netz hinablassen."},
{id:"p4_4",label:"Lk 7,9",title:"So großen Glauben",type:"principle",cluster:"c4",text:"Ich sage euch, selbst nicht in Israel habe ich so großen Glauben gefunden."},
{id:"p4_5",label:"Lk 17,6",title:"Glaube wie ein Senfkorn",type:"principle",cluster:"c4",text:"Wenn ihr Glauben habt wie ein Senfkorn, so würdet ihr zu diesem Maulbeerfeigenbaum sagen: Werde entwurzelt und ins Meer gepflanzt! und er würde euch gehorchen."},
{id:"p4_6",label:"Lk 18,27",title:"Bei Gott möglich",type:"principle",cluster:"c4",text:"Was bei Menschen unmöglich ist, ist möglich bei Gott."},
{id:"p5_1",label:"Lk 9,48b",title:"Wer aufnimmt, nimmt mich auf",type:"principle",cluster:"c5",text:"Wer irgend dieses Kindlein aufnehmen wird in meinem Namen, nimmt mich auf."},
{id:"p5_2",label:"Lk 10,16",title:"Wer euch hört, hört mich",type:"principle",cluster:"c5",text:"Wer euch hört, hört mich; und wer euch verwirft, verwirft mich; wer aber mich verwirft, verwirft den, der mich gesandt hat."},
{id:"p5_3",label:"Lk 22,26",title:"Der Leiter wie der Dienende",type:"principle",cluster:"c5",text:"Ihr aber nicht also; sondern der Größte unter euch sei wie der Jüngste, und der Leiter wie der Dienende."},
{id:"p5_4",label:"Lk 6,36",title:"Seid barmherzig",type:"principle",cluster:"c5",text:"Seid nun barmherzig, wie auch euer Vater barmherzig ist."},
{id:"p6_1",label:"Lk 4,4",title:"Nicht vom Brot allein",type:"principle",cluster:"c6",text:"Nicht vom Brot allein soll der Mensch leben, sondern von jedem Worte Gottes."},
{id:"p6_2",label:"Lk 12,31",title:"Trachtet nach seinem Reiche",type:"principle",cluster:"c6",text:"Trachtet jedoch nach seinem Reiche, und dieses wird euch hinzugefügt werden."},
{id:"p6_3",label:"Lk 13,3",title:"Wenn ihr nicht Buße tut",type:"principle",cluster:"c6",text:"Nein, sage ich euch, sondern wenn ihr nicht Buße tut, werdet ihr alle ebenso umkommen."},
{id:"p6_4",label:"Lk 17,21",title:"Das Reich ist mitten unter euch",type:"principle",cluster:"c6",text:"Denn siehe, das Reich Gottes ist mitten unter euch."},
{id:"p6_5",label:"Lk 18,17",title:"Wie ein Kindlein aufnehmen",type:"principle",cluster:"c6",text:"Wer irgend das Reich Gottes nicht aufnehmen wird wie ein Kindlein, wird nicht in dasselbe eingehen."},
{id:"p6_6",label:"Lk 11,23",title:"Wer nicht mit mir ist",type:"principle",cluster:"c6",text:"Wer nicht mit mir ist, ist wider mich; und wer nicht mit mir sammelt, zerstreut."},
{id:"p7_1",label:"Lk 6,31",title:"Goldene Regel",type:"principle",cluster:"c7",text:"Und wie ihr wollt, daß euch die Menschen tun sollen, tut auch ihr ihnen gleicherweise."},
{id:"p7_2",label:"Lk 6,38",title:"Gebet, und es wird euch gegeben",type:"principle",cluster:"c7",text:"Gebet, und es wird euch gegeben werden: ein gutes, gedrücktes und gerütteltes und überlaufendes Maß wird man in euren Schoß geben; denn mit demselben Maße, mit welchem ihr messet, wird euch wieder gemessen werden."},
{id:"p7_3",label:"Lk 6,40",title:"Der Jünger wie sein Lehrer",type:"principle",cluster:"c7",text:"Ein Jünger ist nicht über den Lehrer; jeder aber, der vollendet ist, wird sein wie sein Lehrer."},
{id:"p7_4",label:"Lk 9,50",title:"Wer nicht wider euch ist",type:"principle",cluster:"c7",text:"Wehret nicht; denn wer nicht wider euch ist, ist für euch."},
{id:"p8_1",label:"Lk 3,11",title:"Wer zwei Leibröcke hat",type:"principle",cluster:"c8",text:"Wer zwei Leibröcke hat, teile dem mit, der keinen hat; und wer Speise hat, tue gleicherweise."},
{id:"p8_2",label:"Lk 11,41",title:"Gebet Almosen",type:"principle",cluster:"c8",text:"Gebet vielmehr Almosen von dem, was ihr habt, und siehe, alles ist euch rein."},
{id:"p8_3",label:"Lk 12,15",title:"Hütet euch vor Habsucht",type:"principle",cluster:"c8",text:"Sehet zu und hütet euch vor aller Habsucht, denn nicht weil jemand Überfluß hat, besteht sein Leben von seiner Habe."},
{id:"p8_4",label:"Lk 12,21",title:"Reich in Bezug auf Gott",type:"principle",cluster:"c8",text:"Also ist der für sich Schätze sammelt, und ist nicht reich in Bezug auf Gott."},
{id:"p8_5",label:"Lk 12,34",title:"Wo euer Schatz ist",type:"principle",cluster:"c8",text:"Denn wo euer Schatz ist, da wird auch euer Herz sein."},
{id:"p8_6",label:"Lk 14,33",title:"Allem entsagen",type:"principle",cluster:"c8",text:"Also nun jeder von euch, der nicht allem entsagt, was er hat, kann nicht mein Jünger sein."},
{id:"p8_7",label:"Lk 16,13",title:"Gott oder Mammon",type:"principle",cluster:"c8",text:"Kein Hausknecht kann zwei Herren dienen; denn entweder wird er den einen hassen und den anderen lieben, oder er wird dem einen anhangen und den anderen verachten. Ihr könnt nicht Gott dienen und dem Mammon."},
{id:"p8_8",label:"Lk 19,8",title:"Zachäus gibt die Hälfte",type:"principle",cluster:"c8",text:"Siehe, Herr, die Hälfte meiner Güter gebe ich den Armen, und wenn ich von jemand etwas durch falsche Anklage genommen habe, so erstatte ich es vierfältig."},
{id:"p8_9",label:"Lk 14,14",title:"Vergeltung in der Auferstehung",type:"principle",cluster:"c8",text:"Und glückselig wirst du sein, weil sie nicht haben, dir zu vergelten; denn es wird dir vergolten werden in der Auferstehung der Gerechten."},
{id:"p9_1",label:"Lk 9,23",title:"Kreuz aufnehmen, täglich",type:"principle",cluster:"c9",text:"Wenn jemand mir nachkommen will, der verleugne sich selbst und nehme sein Kreuz auf täglich und folge mir nach."},
{id:"p9_2",label:"Lk 9,24",title:"Leben verlieren, um zu retten",type:"principle",cluster:"c9",text:"Denn wer irgend sein Leben erretten will, wird es verlieren; wer aber irgend sein Leben verliert um meinetwillen, der wird es erretten."},
{id:"p9_3",label:"Lk 9,25",title:"Welt gewinnen, sich verlieren",type:"principle",cluster:"c9",text:"Denn was wird es einem Menschen nützen, wenn er die ganze Welt gewönne, sich selbst aber verlöre oder einbüßte?"},
{id:"p9_4",label:"Lk 9,62",title:"Hand am Pflug",type:"principle",cluster:"c9",text:"Niemand, der seine Hand an den Pflug gelegt hat und zurückblickt, ist geschickt zum Reiche Gottes."},
{id:"p9_5",label:"Lk 14,27",title:"Kreuz tragen",type:"principle",cluster:"c9",text:"Und wer nicht sein Kreuz trägt und mir nachkommt, kann nicht mein Jünger sein."},
{id:"p9_6",label:"Lk 17,33",title:"Leben retten, Leben verlieren",type:"principle",cluster:"c9",text:"Wer irgend sein Leben zu retten sucht, wird es verlieren; und wer irgend es verliert, wird es erhalten."},
{id:"p9_7",label:"Lk 24,26",title:"Leiden, dann Herrlichkeit",type:"principle",cluster:"c9",text:"Mußte nicht der Christus dies leiden und in seine Herrlichkeit eingehen?"},
{id:"p10_1",label:"Lk 6,43",title:"Kein guter Baum bringt faule Frucht",type:"principle",cluster:"c10",text:"Denn es gibt keinen guten Baum, der faule Frucht bringt, noch einen faulen Baum, der gute Frucht bringt."},
{id:"p10_2",label:"Lk 6,44",title:"Am Baum erkennt man die Frucht",type:"principle",cluster:"c10",text:"Denn ein jeder Baum wird an seiner eigenen Frucht erkannt; denn von Dornen sammelt man nicht Feigen, noch liest man von einem Dornbusch Trauben."},
{id:"p10_3",label:"Lk 6,45",title:"Fülle des Herzens",type:"principle",cluster:"c10",text:"Der gute Mensch bringt aus dem guten Schatze seines Herzens das Gute hervor, und der böse bringt aus dem bösen das Böse hervor; denn aus der Fülle des Herzens redet sein Mund."},
{id:"p10_4",label:"Lk 6,48",title:"Auf den Felsen gegründet",type:"principle",cluster:"c10",text:"Er ist einem Menschen gleich, der ein Haus baute, welcher grub und vertiefte und den Grund auf den Felsen legte; als aber eine Flut kam, schlug der Strom an jenes Haus und vermochte es nicht zu erschüttern, denn es war auf den Felsen gegründet."},
{id:"p10_5",label:"Lk 8,17",title:"Nichts bleibt verborgen",type:"principle",cluster:"c10",text:"Denn es ist nichts verborgen, was nicht offenbar werden wird, noch geheim, was nicht kundwerden und ans Licht kommen soll."},
{id:"p10_6",label:"Lk 8,21",title:"Das Wort hören und tun",type:"principle",cluster:"c10",text:"Meine Mutter und meine Brüder sind diese, welche das Wort Gottes hören und tun."},
{id:"p10_7",label:"Lk 11,17",title:"Reich gegen sich selbst",type:"principle",cluster:"c10",text:"Jedes Reich, das wider sich selbst entzweit ist, wird verwüstet, und Haus wider Haus entzweit, fällt."},
{id:"p10_8",label:"Lk 11,28",title:"Hören und bewahren",type:"principle",cluster:"c10",text:"Ja, vielmehr glückselig, die das Wort Gottes hören und bewahren!"},
{id:"p10_9",label:"Lk 12,2",title:"Nichts verdeckt",type:"principle",cluster:"c10",text:"Es ist aber nichts verdeckt, was nicht aufgedeckt, und verborgen, was nicht kundwerden wird."},
{id:"p10_10",label:"Lk 5,38",title:"Neuer Wein, neue Schläuche",type:"principle",cluster:"c10",text:"Sondern neuen Wein tut man in neue Schläuche, und beide werden zusammen erhalten."},
{id:"p11_1",label:"Lk 11,10",title:"Jeder Bittende empfängt",type:"principle",cluster:"c11",text:"Denn jeder Bittende empfängt, und der Suchende findet, und dem Anklopfenden wird aufgetan werden."},
{id:"p11_2",label:"Lk 18,1",title:"Allezeit beten, nicht ermatten",type:"principle",cluster:"c11",text:"Er sagte ihnen aber auch ein Gleichnis dafür, daß sie allezeit beten und nicht ermatten sollten."},
{id:"p11_3",label:"Lk 21,19",title:"Seelen gewinnen durch Ausharren",type:"principle",cluster:"c11",text:"Gewinnet eure Seelen durch euer Ausharren."},
{id:"p11_4",label:"Lk 12,40",title:"Seid bereit",type:"principle",cluster:"c11",text:"Auch ihr nun, seid bereit; denn in der Stunde, in welcher ihr es nicht meinet, kommt der Sohn des Menschen."},
{id:"p11_5",label:"Lk 10,42",title:"Eines ist not",type:"principle",cluster:"c11",text:"Eines aber ist not. Maria aber hat das gute Teil erwählt, welches nicht von ihr genommen werden wird."},
{id:"p11_6",label:"Lk 24,32",title:"Brannte nicht unser Herz",type:"principle",cluster:"c11",text:"Brannte nicht unser Herz in uns, als er auf dem Wege zu uns redete, und als er uns die Schriften öffnete?"},
{id:"p12_1",label:"Lk 8,18",title:"Wer hat, dem wird gegeben",type:"principle",cluster:"c12",text:"Sehet nun zu, wie ihr höret; denn wer irgend hat, dem wird gegeben werden, und wer irgend nicht hat, von dem wird selbst was er zu haben scheint genommen werden."},
{id:"p12_2",label:"Lk 12,48",title:"Wem viel gegeben ist",type:"principle",cluster:"c12",text:"Jedem aber, dem viel gegeben ist, viel wird von ihm verlangt werden; und wem man viel anvertraut hat, von dem wird man desto mehr fordern."},

{id:"p12_4",label:"Lk 19,17",title:"Gewalt über zehn Städte",type:"principle",cluster:"c12",text:"Wohl, du guter Knecht! Weil du im Geringsten treu warst, so habe Gewalt über zehn Städte."},
{id:"p12_5",label:"Lk 19,26",title:"Jedem, der da hat",type:"principle",cluster:"c12",text:"Denn ich sage euch: Jedem, der da hat, wird gegeben werden; von dem aber, der nicht hat, von dem wird selbst, was er hat, weggenommen werden."},
{id:"p12_6",label:"Lk 17,10",title:"Unnütze Knechte",type:"principle",cluster:"c12",text:"Also auch ihr, wenn ihr alles getan habt, was euch befohlen ist, so sprechet: Wir sind unnütze Knechte; wir haben getan, was wir zu tun schuldig waren."}

{source:"c10",target:"c12",weight:0.6},
{source:"c11",target:"c6",weight:0.7},
{source:"c12",target:"c3",weight:0.6}
]
};

const svg=d3.select("svg"),tooltip=document.getElementById("tooltip");
let width=innerWidth,height=innerHeight;
const zoomG=svg.append("g");
const zoom=d3.zoom().scaleExtent([0.35,3]).on("zoom",e=>zoomG.attr("transform",e.transform));
svg.call(zoom);
const clusterNodes=data.nodes.filter(n=>n.type==="cluster");
const principleNodes=data.nodes.filter(n=>n.type==="principle");
const clusterLinks=data.edges.map(e=>({source:e.source,target:e.target,weight:e.weight,kind:"cluster"}));
const membershipLinks=principleNodes.map(p=>({source:p.cluster,target:p.id,weight:1,kind:"membership"}));
const allLinks=[...clusterLinks,...membershipLinks];
function lighten(h,a){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return"rgb("+Math.round(r+(255-r)*a)+","+Math.round(g+(255-g)*a)+","+Math.round(b+(255-b)*a)+")"}
const clusterById=new Map(clusterNodes.map(c=>[c.id,c]));
principleNodes.forEach(p=>{p.color=lighten(clusterById.get(p.cluster).color,.28)});
const simulation=d3.forceSimulation(data.nodes)
.force("link",d3.forceLink(allLinks).id(d=>d.id).strength(d=>d.kind==="cluster"?.08:.95).distance(d=>d.kind==="cluster"?155:72))
.force("charge",d3.forceManyBody().strength(d=>d.type==="cluster"?-1000:-95))
.force("center",d3.forceCenter(width/2,height/2))
.force("collide",d3.forceCollide().radius(d=>d.type==="cluster"?d.size+14:18))
.alphaDecay(.025);
function fitGraph(a){const p=70,xs=data.nodes.map(n=>n.x),ys=data.nodes.map(n=>n.y);
const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
const dx=mxx-mnx+110,dy=mxy-mny+150,cx=(mnx+mxx)/2,cy=(mny+mxy)/2;
const sc=Math.min((width-p*2)/dx,(height-p*2)/dy,1.6),tx=width/2-sc*cx,ty=height/2-sc*cy;
const t=d3.zoomIdentity.translate(tx,ty).scale(sc);
a?svg.transition().duration(900).ease(d3.easeCubicInOut).call(zoom.transform,t):svg.call(zoom.transform,t)}
function updatePositions(){
edgeSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
principleSel.attr("cx",d=>d.x).attr("cy",d=>d.y);
clusterSel.attr("cx",d=>d.x).attr("cy",d=>d.y);
labelSel.attr("x",d=>d.x).attr("y",d=>d.y+d.size+24)}
simulation.stop();
for(let i=0;i<400;i++)simulation.tick();
const edgeSel=zoomG.append("g").selectAll("line").data(clusterLinks).join("line")
.attr("stroke","#f5f1e8").attr("stroke-opacity",d=>.12+d.weight*.22).attr("stroke-width",d=>.6+d.weight*2.6).attr("stroke-linecap","round");
const principleSel=zoomG.append("g").selectAll("circle").data(principleNodes).join("circle")
.attr("r",13).attr("fill",d=>d.color).attr("stroke","#1a1a2e").attr("stroke-width",1.8).style("cursor","pointer").call(makeDrag(simulation));
const clusterSel=zoomG.append("g").selectAll("circle").data(clusterNodes).join("circle")
.attr("r",d=>d.size).attr("fill",d=>d.color).attr("stroke","#f5f1e8").attr("stroke-width",1.2).attr("fill-opacity",.85).style("cursor","grab").call(makeDrag(simulation));
const labelSel=zoomG.append("g").selectAll("text").data(clusterNodes).join("text").attr("class","cluster-label").text(d=>d.label);
updatePositions();simulation.on("tick",updatePositions);fitGraph(false);
function makeDrag(s){return d3.drag()
.on("start",(e,d)=>{if(!e.active)s.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y})
.on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
.on("end",(e,d)=>{if(!e.active)s.alphaTarget(0);d.fx=null;d.fy=null})}
function showTip(h,x,y){tooltip.innerHTML=h;tooltip.style.left=Math.min(x+16,innerWidth-460)+"px";tooltip.style.top=Math.min(y+16,innerHeight-150)+"px";tooltip.style.opacity=1}
function hideTip(){tooltip.style.opacity=0}
principleSel.on("mouseenter",function(e,d){
d3.select(this).transition().duration(140).attr("r",18);
const c=clusterById.get(d.cluster);
showTip('<span class="ref" style="color:'+lighten(c.color,.4)+'">'+d.label+' — '+d.title+'</span><span class="text">„'+d.text+'"</span><span class="hint">Alte Elberfelder 1905 · Wandeln-Fokus-Edition</span>',e.clientX,e.clientY)})
.on("mousemove",e=>{tooltip.style.left=Math.min(e.clientX+16,innerWidth-460)+"px";tooltip.style.top=Math.min(e.clientY+16,innerHeight-150)+"px"})
.on("mouseleave",function(){d3.select(this).transition().duration(140).attr("r",13);hideTip()});
clusterSel.on("mouseenter",function(e,d){
principleSel.transition().duration(180).attr("opacity",p=>p.cluster===d.id?1:.12).attr("r",p=>p.cluster===d.id?15:10);
clusterSel.transition().duration(180).attr("fill-opacity",c=>c.id===d.id?1:.25);
labelSel.transition().duration(180).attr("opacity",c=>c.id===d.id?1:.3);
edgeSel.transition().duration(180).attr("stroke-opacity",l=>(l.source.id===d.id||l.target.id===d.id)?.55:.04);
const cnt=principleNodes.filter(p=>p.cluster===d.id).length;
showTip('<span class="ref" style="color:'+lighten(d.color,.4)+'">'+d.label+'</span><span class="text">'+cnt+' Prinzipien</span>',e.clientX,e.clientY)})
.on("mousemove",e=>{tooltip.style.left=Math.min(e.clientX+16,innerWidth-460)+"px";tooltip.style.top=Math.min(e.clientY+16,innerHeight-150)+"px"})
.on("mouseleave",function(){
principleSel.transition().duration(180).attr("opacity",1).attr("r",13);
clusterSel.transition().duration(180).attr("fill-opacity",.85);
labelSel.transition().duration(180).attr("opacity",1);
edgeSel.transition().duration(180).attr("stroke-opacity",l=>.12+l.weight*.22);hideTip()});
document.getElementById("reset").addEventListener("click",()=>{
data.nodes.forEach(n=>{n.fx=null;n.fy=null});
simulation.stop();simulation.alpha(1);
for(let i=0;i<400;i++)simulation.tick();
updatePositions();fitGraph(true)});
addEventListener("resize",()=>{width=innerWidth;height=innerHeight;simulation.force("center",d3.forceCenter(width/2,height/2));fitGraph(true)});
</script>
</body>
</html>
